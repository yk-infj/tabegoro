<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>たべごろ — 食材管理</title>
  
  <!-- React & Tailwind -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen selection:bg-neutral-200">
  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 初期設定（デモ用共有プロジェクト設定）
    const firebaseConfig = {
      apiKey: "AIzaSyD-PlaceholderKeyForAppSync",
      authDomain: "tabegoro-app.firebaseapp.com",
      projectId: "tabegoro-app",
      storageBucket: "tabegoro-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.FirebaseAPI = {
      auth, db,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CATEGORIES = [
      { id: 'all', name: 'すべて' },
      { id: 'fresh', name: '生鮮食品' },
      { id: 'chilled', name: '加工・乳製品' },
      { id: 'seasoning', name: '調味料' },
      { id: 'other', name: 'その他' }
    ];

    const getFormattedDate = (offsetDays = 0) => {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      return date.toISOString().split('T')[0];
    };

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isSignUp, setIsSignUp] = useState(false);
      
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');

      const [items, setItems] = useState([]);
      const [shoppingList, setShoppingList] = useState([]);
      const [activeTab, setActiveTab] = useState('fridge');
      const [selectedCategory, setSelectedCategory] = useState('all');
      
      const [isFridgeModalOpen, setIsFridgeModalOpen] = useState(false);
      const [isShoppingModalOpen, setIsShoppingModalOpen] = useState(false);

      const [fridgeFormData, setFridgeFormData] = useState({ name: '', category: 'fresh', expiryDate: getFormattedDate(3), quantity: '1' });
      const [shoppingInput, setShoppingInput] = useState('');

      useEffect(() => {
        const interval = setInterval(() => {
          if (window.FirebaseAPI) {
            clearInterval(interval);
            const { auth, onAuthStateChanged } = window.FirebaseAPI;
            onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              setLoading(false);
            });
          }
        }, 100);
        return () => clearInterval(interval);
      }, []);

      // リアルタイムデータベース同期
      useEffect(() => {
        if (!user || !window.FirebaseAPI) return;
        const { db, collection, onSnapshot, query, orderBy } = window.FirebaseAPI;

        // 冷蔵庫データの同期
        const fridgeRef = collection(db, 'users', user.uid, 'fridge');
        const qFridge = query(fridgeRef, orderBy('expiryDate', 'asc'));
        const unsubscribeFridge = onSnapshot(qFridge, (snapshot) => {
          const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setItems(list);
        });

        // 買い物リストの同期
        const shopRef = collection(db, 'users', user.uid, 'shopping');
        const unsubscribeShop = onSnapshot(shopRef, (snapshot) => {
          const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setShoppingList(list);
        });

        return () => {
          unsubscribeFridge();
          unsubscribeShop();
        };
      }, [user]);

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.FirebaseAPI;
        try {
          if (isSignUp) {
            await createUserWithEmailAndPassword(auth, email, password);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
          }
        } catch (err) {
          setAuthError(isSignUp ? 'アカウント作成に失敗しました（パスワード6文字以上）' : 'メールアドレスまたはパスワードが正しくありません');
        }
      };

      const handleLogout = () => {
        const { auth, signOut } = window.FirebaseAPI;
        signOut(auth);
      };

      const handleAddFridgeItem = async (e) => {
        e.preventDefault();
        if (!fridgeFormData.name.trim() || !user) return;
        const { db, collection, addDoc } = window.FirebaseAPI;
        await addDoc(collection(db, 'users', user.uid, 'fridge'), fridgeFormData);
        setIsFridgeModalOpen(false);
        setFridgeFormData({ name: '', category: 'fresh', expiryDate: getFormattedDate(3), quantity: '1' });
      };

      const handleAddShoppingItem = async (e) => {
        e.preventDefault();
        if (!shoppingInput.trim() || !user) return;
        const { db, collection, addDoc } = window.FirebaseAPI;
        await addDoc(collection(db, 'users', user.uid, 'shopping'), { name: shoppingInput.trim() });
        setIsShoppingModalOpen(false);
        setShoppingInput('');
      };

      const handleConsumeItem = async (item, addToShop = false) => {
        if (!user) return;
        const { db, doc, deleteDoc, collection, addDoc } = window.FirebaseAPI;
        await deleteDoc(doc(db, 'users', user.uid, 'fridge', item.id));
        if (addToShop) {
          await addDoc(collection(db, 'users', user.uid, 'shopping'), { name: item.name });
        }
      };

      const handleDeleteShoppingItem = async (id) => {
        if (!user) return;
        const { db, doc, deleteDoc } = window.FirebaseAPI;
        await deleteDoc(doc(db, 'users', user.uid, 'shopping', id));
      };

      const getItemStatus = (expiryDateStr) => {
        const today = new Date(); today.setHours(0,0,0,0);
        const expiry = new Date(expiryDateStr); expiry.setHours(0,0,0,0);
        const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

        if (diffDays < 0) return { label: '期限切れ', style: 'text-rose-600 bg-rose-50 border-rose-100' };
        if (diffDays <= 1) return { label: diffDays === 0 ? '本日まで' : '明日まで', style: 'text-amber-600 bg-amber-50 border-amber-100' };
        return { label: `あと ${diffDays} 日`, style: 'text-neutral-500 bg-neutral-100/60 border-neutral-200/60' };
      };

      const filteredItems = useMemo(() => {
        return items.filter(i => selectedCategory === 'all' || i.category === selectedCategory);
      }, [items, selectedCategory]);

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#f5f5f7]">
            <div className="text-xs text-neutral-400 animate-pulse">読み込み中...</div>
          </div>
        );
      }

      // 未ログイン（ログイン・会員登録画面）
      if (!user) {
        return (
          <div className="min-h-screen max-w-md mx-auto bg-[#f5f5f7] flex items-center justify-center p-6 antialiased">
            <div className="w-full glass-card rounded-3xl p-8 border border-white/60 space-y-6">
              <div className="text-center">
                <span className="text-[10px] font-semibold tracking-widest text-neutral-400 uppercase">Cloud Sync</span>
                <h1 className="text-2xl font-semibold tracking-tight text-neutral-900 mt-1">たべごろ</h1>
                <p className="text-xs text-neutral-500 mt-2">スマホ間でデータが同期されます</p>
              </div>

              <form onSubmit={handleAuth} className="space-y-3">
                <input 
                  type="email"
                  required
                  placeholder="メールアドレス"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full bg-neutral-100/80 border-0 rounded-2xl px-4 py-3.5 text-xs focus:ring-1 focus:ring-neutral-400 outline-none"
                />
                <input 
                  type="password"
                  required
                  placeholder="パスワード（6文字以上）"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full bg-neutral-100/80 border-0 rounded-2xl px-4 py-3.5 text-xs focus:ring-1 focus:ring-neutral-400 outline-none"
                />

                {authError && <p className="text-xs text-rose-500 text-center">{authError}</p>}

                <button 
                  type="submit"
                  className="w-full bg-neutral-900 text-white font-medium py-3.5 rounded-2xl text-xs tracking-wide hover:bg-neutral-800 transition"
                >
                  {isSignUp ? 'アカウントを作成' : 'ログイン'}
                </button>
              </form>

              <div className="text-center pt-2">
                <button 
                  onClick={() => { setIsSignUp(!isSignUp); setAuthError(''); }}
                  className="text-xs text-neutral-500 hover:text-neutral-900 transition underline underline-offset-4"
                >
                  {isSignUp ? 'すでに登録済みの方はこちら' : '初めての方（新規登録）'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ログイン済み（メイン画面）
      return (
        <div className="min-h-screen max-w-md mx-auto bg-[#f5f5f7] pb-28 relative font-normal antialiased">
          <header className="sticky top-0 z-30 glass-header border-b border-neutral-200/50 px-6 pt-10 pb-4 transition-all">
            <div className="flex justify-between items-baseline mb-4">
              <div>
                <span className="text-[10px] font-semibold tracking-widest text-neutral-400 uppercase">
                  {user.email}
                </span>
                <h1 className="text-2xl font-semibold tracking-tight text-neutral-900 mt-0.5">
                  {activeTab === 'fridge' ? 'たべごろ' : '買い物リスト'}
                </h1>
              </div>
              <div className="flex items-center gap-2">
                <button 
                  onClick={handleLogout}
                  className="text-[11px] text-neutral-400 hover:text-neutral-800 transition mr-2"
                >
                  ログアウト
                </button>
                <button 
                  onClick={() => activeTab === 'fridge' ? setIsFridgeModalOpen(true) : setIsShoppingModalOpen(true)}
                  className="text-xs font-medium text-neutral-900 bg-neutral-200/70 hover:bg-neutral-200 px-3.5 py-1.5 rounded-full transition-all"
                >
                  ＋ 追加
                </button>
              </div>
            </div>

            {activeTab === 'fridge' && (
              <div className="flex gap-2 overflow-x-auto no-scrollbar pt-1">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setSelectedCategory(cat.id)}
                    className={`whitespace-nowrap text-xs px-3 py-1.5 rounded-full transition-all duration-200 ${
                      selectedCategory === cat.id 
                        ? 'bg-neutral-900 text-white font-medium shadow-sm' 
                        : 'text-neutral-500 hover:text-neutral-800'
                    }`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>
            )}
          </header>

          <main className="px-5 pt-6 space-y-3">
            {activeTab === 'fridge' && (
              <>
                {filteredItems.length === 0 ? (
                  <div className="text-center py-20 text-neutral-400 text-xs font-light tracking-wide">
                    食材はありません
                  </div>
                ) : (
                  filteredItems.map(item => {
                    const status = getItemStatus(item.expiryDate);
                    const catName = CATEGORIES.find(c => c.id === item.category)?.name || '';
                    return (
                      <div key={item.id} className="glass-card rounded-2xl p-4 border border-white/60 transition-all">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="flex items-center gap-2">
                              <h2 className="text-sm font-medium text-neutral-900 tracking-tight">{item.name}</h2>
                              <span className="text-[10px] text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded-md">{catName}</span>
                            </div>
                            <p className="text-[11px] text-neutral-400 mt-1">{item.quantity}</p>
                          </div>
                          <span className={`text-[10px] font-medium px-2.5 py-1 rounded-full border ${status.style}`}>
                            {status.label}
                          </span>
                        </div>

                        <div className="mt-4 pt-3 border-t border-neutral-100 flex justify-between items-center text-[11px]">
                          <span className="text-neutral-400 font-light">賞味期限 {item.expiryDate.replace(/-/g, '.')}</span>
                          <div className="flex gap-3">
                            <button 
                              onClick={() => handleConsumeItem(item, true)} 
                              className="text-neutral-500 hover:text-neutral-900 transition"
                            >
                              買出しへ
                            </button>
                            <button 
                              onClick={() => handleConsumeItem(item, false)} 
                              className="text-neutral-900 font-medium hover:opacity-70 transition"
                            >
                              消費完了
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </>
            )}

            {activeTab === 'shopping' && (
              <div className="space-y-2">
                {shoppingList.length === 0 ? (
                  <div className="text-center py-20 text-neutral-400 text-xs font-light">
                    買い物リストは空です
                  </div>
                ) : (
                  shoppingList.map(item => (
                    <div key={item.id} className="glass-card rounded-2xl p-4 border border-white/60 flex justify-between items-center">
                      <span className="text-sm font-medium text-neutral-800">{item.name}</span>
                      <button 
                        onClick={() => handleDeleteShoppingItem(item.id)}
                        className="text-xs text-neutral-400 hover:text-neutral-900 font-medium transition"
                      >
                        購入完了
                      </button>
                    </div>
                  ))
                )}
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-header border-t border-neutral-200/40 px-12 py-3.5 flex justify-around items-center z-30">
            <button 
              onClick={() => setActiveTab('fridge')} 
              className={`text-xs tracking-tight transition-all ${activeTab === 'fridge' ? 'font-semibold text-neutral-900' : 'text-neutral-400 font-light'}`}
            >
              冷蔵庫
            </button>
            <button 
              onClick={() => setActiveTab('shopping')} 
              className={`text-xs tracking-tight transition-all ${activeTab === 'shopping' ? 'font-semibold text-neutral-900' : 'text-neutral-400 font-light'}`}
            >
              買い物リスト
            </button>
          </nav>

          {/* 冷蔵庫追加 */}
          {isFridgeModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/20 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-white/90 backdrop-blur-xl w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white/40 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-semibold text-neutral-900">冷蔵庫へ追加</h3>
                  <button onClick={() => setIsFridgeModalOpen(false)} className="text-xs text-neutral-400 hover:text-neutral-800">キャンセル</button>
                </div>
                <form onSubmit={handleAddFridgeItem} className="space-y-3">
                  <input type="text" required placeholder="名称 (例: 牛乳)" value={fridgeFormData.name} onChange={e => setFridgeFormData({...fridgeFormData, name: e.target.value})} className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs outline-none"/>
                  <select value={fridgeFormData.category} onChange={e => setFridgeFormData({...fridgeFormData, category: e.target.value})} className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs outline-none text-neutral-700">
                    <option value="fresh">生鮮食品</option>
                    <option value="chilled">加工・乳製品</option>
                    <option value="seasoning">調味料</option>
                    <option value="other">その他</option>
                  </select>
                  <input type="date" required value={fridgeFormData.expiryDate} onChange={e => setFridgeFormData({...fridgeFormData, expiryDate: e.target.value})} className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs outline-none text-neutral-700"/>
                  <input type="text" placeholder="分量 (例: 1本、250g)" value={fridgeFormData.quantity} onChange={e => setFridgeFormData({...fridgeFormData, quantity: e.target.value})} className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs outline-none"/>
                  <button type="submit" className="w-full bg-neutral-900 text-white font-medium py-3 rounded-xl text-xs hover:bg-neutral-800 transition">登録する</button>
                </form>
              </div>
            </div>
          )}

          {/* 買い物リスト追加 */}
          {isShoppingModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/20 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-white/90 backdrop-blur-xl w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white/40 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-semibold text-neutral-900">買い物リストへ追加</h3>
                  <button onClick={() => setIsShoppingModalOpen(false)} className="text-xs text-neutral-400 hover:text-neutral-800">キャンセル</button>
                </div>
                <form onSubmit={handleAddShoppingItem} className="space-y-3">
                  <input type="text" required placeholder="買うもの (例: バター)" value={shoppingInput} onChange={e => setShoppingInput(e.target.value)} className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs outline-none"/>
                  <button type="submit" className="w-full bg-neutral-900 text-white font-medium py-3 rounded-xl text-xs hover:bg-neutral-800 transition">登録する</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
