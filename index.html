<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>たべごろ — 食材管理</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;600&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen selection:bg-neutral-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 🔒 アクセス用のパスコード（お好きな番号に変更してください）
    const SECRET_PASSCODE = '1234';

    const CATEGORIES = [
      { id: 'all', name: 'すべて' },
      { id: 'fresh', name: '生鮮食品' },
      { id: 'chilled', name: '加工・乳製品' },
      { id: 'seasoning', name: '調味料' },
      { id: 'other', name: 'その他' }
    ];

    const getFormattedDate = (offsetDays = 0) => {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      return date.toISOString().split('T')[0];
    };

    const INITIAL_ITEMS = [
      { id: '1', name: '有機牛乳', category: 'chilled', expiryDate: getFormattedDate(-1), quantity: '1本' },
      { id: '2', name: '黒豚バラ肉', category: 'fresh', expiryDate: getFormattedDate(0), quantity: '250g' },
      { id: '3', name: '平飼い有精卵', category: 'chilled', expiryDate: getFormattedDate(2), quantity: '6個' },
      { id: '4', name: 'アボカド', category: 'fresh', expiryDate: getFormattedDate(5), quantity: '2個' }
    ];

    const STORAGE_KEYS = { 
      FRIDGE: 'tabegoro_v4_items', 
      SHOPPING: 'tabegoro_v4_shop',
      AUTH: 'tabegoro_v4_auth'
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passcode, setPasscode] = useState('');
      const [passError, setPassError] = useState(false);

      const [items, setItems] = useState([]);
      const [shoppingList, setShoppingList] = useState([]);
      const [activeTab, setActiveTab] = useState('fridge');
      const [selectedCategory, setSelectedCategory] = useState('all');
      
      const [isFridgeModalOpen, setIsFridgeModalOpen] = useState(false);
      const [isShoppingModalOpen, setIsShoppingModalOpen] = useState(false);

      const [fridgeFormData, setFridgeFormData] = useState({ name: '', category: 'fresh', expiryDate: getFormattedDate(3), quantity: '1' });
      const [shoppingInput, setShoppingInput] = useState('');

      useEffect(() => {
        // 認証チェック
        const authState = localStorage.getItem(STORAGE_KEYS.AUTH);
        if (authState === 'true') {
          setIsAuthenticated(true);
        }

        try {
          const savedFridge = localStorage.getItem(STORAGE_KEYS.FRIDGE);
          const savedShopping = localStorage.getItem(STORAGE_KEYS.SHOPPING);
          setItems(savedFridge ? JSON.parse(savedFridge) : INITIAL_ITEMS);
          setShoppingList(savedShopping ? JSON.parse(savedShopping) : []);
        } catch (e) {
          setItems(INITIAL_ITEMS);
        }
      }, []);

      useEffect(() => { localStorage.setItem(STORAGE_KEYS.FRIDGE, JSON.stringify(items)); }, [items]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.SHOPPING, JSON.stringify(shoppingList)); }, [shoppingList]);

      // ログイン処理
      const handleLogin = (e) => {
        e.preventDefault();
        if (passcode === SECRET_PASSCODE) {
          setIsAuthenticated(true);
          setPassError(false);
          localStorage.setItem(STORAGE_KEYS.AUTH, 'true');
        } else {
          setPassError(true);
        }
      };

      const getItemStatus = (expiryDateStr) => {
        const today = new Date(); today.setHours(0,0,0,0);
        const expiry = new Date(expiryDateStr); expiry.setHours(0,0,0,0);
        const diffDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));

        if (diffDays < 0) return { label: '期限切れ', style: 'text-rose-600 bg-rose-50 border-rose-100' };
        if (diffDays <= 1) return { label: diffDays === 0 ? '本日まで' : '明日まで', style: 'text-amber-600 bg-amber-50 border-amber-100' };
        return { label: `あと ${diffDays} 日`, style: 'text-neutral-500 bg-neutral-100/60 border-neutral-200/60' };
      };

      const filteredItems = useMemo(() => {
        return items.filter(i => {
          return selectedCategory === 'all' || i.category === selectedCategory;
        }).sort((a,b) => new Date(a.expiryDate) - new Date(b.expiryDate));
      }, [items, selectedCategory]);

      const handleAddFridgeItem = (e) => {
        e.preventDefault();
        if (!fridgeFormData.name.trim()) return;
        setItems(prev => [{ id: Date.now().toString(), ...fridgeFormData }, ...prev]);
        setIsFridgeModalOpen(false);
        setFridgeFormData({ name: '', category: 'fresh', expiryDate: getFormattedDate(3), quantity: '1' });
      };

      const handleAddShoppingItem = (e) => {
        e.preventDefault();
        if (!shoppingInput.trim()) return;
        setShoppingList(prev => [...prev, { id: Date.now().toString(), name: shoppingInput.trim() }]);
        setIsShoppingModalOpen(false);
        setShoppingInput('');
      };

      const handleConsumeItem = (id, addToShop = false) => {
        const target = items.find(i => i.id === id);
        if (!target) return;
        setItems(prev => prev.filter(i => i.id !== id));
        if (addToShop) {
          setShoppingList(prev => [...prev, { id: Date.now().toString(), name: target.name }]);
        }
      };

      // 🔒 未ログイン時のロック画面
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen max-w-md mx-auto bg-[#f5f5f7] flex items-center justify-center p-6 antialiased">
            <div className="w-full glass-card rounded-3xl p-8 border border-white/60 space-y-6 text-center">
              <div>
                <span className="text-[10px] font-semibold tracking-widest text-neutral-400 uppercase">Private Space</span>
                <h1 className="text-2xl font-semibold tracking-tight text-neutral-900 mt-1">たべごろ</h1>
                <p className="text-xs text-neutral-500 mt-2">パスコードを入力してログインしてください</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input 
                    type="password"
                    pattern="[0-9]*"
                    inputMode="numeric"
                    maxLength="8"
                    placeholder="パスコード"
                    value={passcode}
                    onChange={(e) => setPasscode(e.target.value)}
                    className="w-full bg-neutral-100/80 border-0 rounded-2xl px-4 py-3.5 text-center text-lg tracking-widest focus:ring-1 focus:ring-neutral-400 outline-none"
                  />
                  {passError && (
                    <p className="text-xs text-rose-500 mt-2">パスコードが違います</p>
                  )}
                </div>
                <button 
                  type="submit"
                  className="w-full bg-neutral-900 text-white font-medium py-3.5 rounded-2xl text-xs tracking-wide hover:bg-neutral-800 transition"
                >
                  解除して開く
                </button>
              </form>
            </div>
          </div>
        );
      }

      // 🔓 アプリ本体画面
      return (
        <div className="min-h-screen max-w-md mx-auto bg-[#f5f5f7] pb-28 relative font-normal antialiased">
          
          {/* Header */}
          <header className="sticky top-0 z-30 glass-header border-b border-neutral-200/50 px-6 pt-12 pb-4 transition-all">
            <div className="flex justify-between items-baseline mb-4">
              <div>
                <span className="text-[11px] font-semibold tracking-widest text-neutral-400 uppercase">
                  {activeTab === 'fridge' ? 'Refrigerator' : 'Shopping List'}
                </span>
                <h1 className="text-2xl font-semibold tracking-tight text-neutral-900 mt-0.5">
                  {activeTab === 'fridge' ? 'たべごろ' : '買い物リスト'}
                </h1>
              </div>
              <button 
                onClick={() => activeTab === 'fridge' ? setIsFridgeModalOpen(true) : setIsShoppingModalOpen(true)}
                className="text-xs font-medium text-neutral-900 bg-neutral-200/70 hover:bg-neutral-200 px-3.5 py-1.5 rounded-full transition-all"
              >
                ＋ 追加
              </button>
            </div>

            {activeTab === 'fridge' && (
              <div className="flex gap-2 overflow-x-auto no-scrollbar pt-1">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setSelectedCategory(cat.id)}
                    className={`whitespace-nowrap text-xs px-3 py-1.5 rounded-full transition-all duration-200 ${
                      selectedCategory === cat.id 
                        ? 'bg-neutral-900 text-white font-medium shadow-sm' 
                        : 'text-neutral-500 hover:text-neutral-800'
                    }`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* Main Content */}
          <main className="px-5 pt-6 space-y-3">
            {activeTab === 'fridge' && (
              <>
                {filteredItems.length === 0 ? (
                  <div className="text-center py-20 text-neutral-400 text-xs font-light tracking-wide">
                    食材はありません
                  </div>
                ) : (
                  filteredItems.map(item => {
                    const status = getItemStatus(item.expiryDate);
                    const catName = CATEGORIES.find(c => c.id === item.category)?.name || '';
                    return (
                      <div key={item.id} className="glass-card rounded-2xl p-4 border border-white/60 transition-all">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="flex items-center gap-2">
                              <h2 className="text-sm font-medium text-neutral-900 tracking-tight">{item.name}</h2>
                              <span className="text-[10px] text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded-md">{catName}</span>
                            </div>
                            <p className="text-[11px] text-neutral-400 mt-1">{item.quantity}</p>
                          </div>
                          <span className={`text-[10px] font-medium px-2.5 py-1 rounded-full border ${status.style}`}>
                            {status.label}
                          </span>
                        </div>

                        <div className="mt-4 pt-3 border-t border-neutral-100 flex justify-between items-center text-[11px]">
                          <span className="text-neutral-400 font-light">賞味期限 {item.expiryDate.replace(/-/g, '.')}</span>
                          <div className="flex gap-3">
                            <button 
                              onClick={() => handleConsumeItem(item.id, true)} 
                              className="text-neutral-500 hover:text-neutral-900 transition"
                            >
                              買出しへ
                            </button>
                            <button 
                              onClick={() => handleConsumeItem(item.id, false)} 
                              className="text-neutral-900 font-medium hover:opacity-70 transition"
                            >
                              消費完了
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </>
            )}

            {activeTab === 'shopping' && (
              <div className="space-y-2">
                {shoppingList.length === 0 ? (
                  <div className="text-center py-20 text-neutral-400 text-xs font-light">
                    買い物リストは空です
                  </div>
                ) : (
                  shoppingList.map(item => (
                    <div key={item.id} className="glass-card rounded-2xl p-4 border border-white/60 flex justify-between items-center">
                      <span className="text-sm font-medium text-neutral-800">{item.name}</span>
                      <button 
                        onClick={() => setShoppingList(prev => prev.filter(i => i.id !== item.id))}
                        className="text-xs text-neutral-400 hover:text-neutral-900 font-medium transition"
                      >
                        購入完了
                      </button>
                    </div>
                  ))
                )}
              </div>
            )}
          </main>

          {/* Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-header border-t border-neutral-200/40 px-12 py-3.5 flex justify-around items-center z-30">
            <button 
              onClick={() => setActiveTab('fridge')} 
              className={`text-xs tracking-tight transition-all ${activeTab === 'fridge' ? 'font-semibold text-neutral-900' : 'text-neutral-400 font-light'}`}
            >
              冷蔵庫
            </button>
            <button 
              onClick={() => setActiveTab('shopping')} 
              className={`text-xs tracking-tight transition-all ${activeTab === 'shopping' ? 'font-semibold text-neutral-900' : 'text-neutral-400 font-light'}`}
            >
              買い物リスト
            </button>
          </nav>

          {/* 冷蔵庫追加モーダル */}
          {isFridgeModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/20 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-white/90 backdrop-blur-xl w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white/40 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-semibold text-neutral-900">冷蔵庫へ追加</h3>
                  <button onClick={() => setIsFridgeModalOpen(false)} className="text-xs text-neutral-400 hover:text-neutral-800">キャンセル</button>
                </div>
                
                <form onSubmit={handleAddFridgeItem} className="space-y-3">
                  <input 
                    type="text" 
                    required 
                    placeholder="名称 (例: 牛乳)" 
                    value={fridgeFormData.name} 
                    onChange={e => setFridgeFormData({...fridgeFormData, name: e.target.value})} 
                    className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs focus:ring-1 focus:ring-neutral-400 outline-none"
                  />
                  <select 
                    value={fridgeFormData.category} 
                    onChange={e => setFridgeFormData({...fridgeFormData, category: e.target.value})}
                    className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs focus:ring-1 focus:ring-neutral-400 outline-none text-neutral-700"
                  >
                    <option value="fresh">生鮮食品</option>
                    <option value="chilled">加工・乳製品</option>
                    <option value="seasoning">調味料</option>
                    <option value="other">その他</option>
                  </select>
                  <input 
                    type="date" 
                    required 
                    value={fridgeFormData.expiryDate} 
                    onChange={e => setFridgeFormData({...fridgeFormData, expiryDate: e.target.value})} 
                    className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs focus:ring-1 focus:ring-neutral-400 outline-none text-neutral-700"
                  />
                  <input 
                    type="text" 
                    placeholder="分量 (例: 1本、250g)" 
                    value={fridgeFormData.quantity} 
                    onChange={e => setFridgeFormData({...fridgeFormData, quantity: e.target.value})} 
                    className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs focus:ring-1 focus:ring-neutral-400 outline-none"
                  />
                  <button type="submit" className="w-full bg-neutral-900 text-white font-medium py-3 rounded-xl text-xs tracking-wide hover:bg-neutral-800 transition">
                    冷蔵庫に登録
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 買い物リスト追加モーダル */}
          {isShoppingModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/20 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-white/90 backdrop-blur-xl w-full max-w-md rounded-3xl p-6 shadow-2xl border border-white/40 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-semibold text-neutral-900">買い物リストへ追加</h3>
                  <button onClick={() => setIsShoppingModalOpen(false)} className="text-xs text-neutral-400 hover:text-neutral-800">キャンセル</button>
                </div>
                
                <form onSubmit={handleAddShoppingItem} className="space-y-3">
                  <input 
                    type="text" 
                    required 
                    placeholder="買うもの (例: バター)" 
                    value={shoppingInput} 
                    onChange={e => setShoppingInput(e.target.value)} 
                    className="w-full bg-neutral-100/80 border-0 rounded-xl px-4 py-3 text-xs focus:ring-1 focus:ring-neutral-400 outline-none"
                  />
                  <button type="submit" className="w-full bg-neutral-900 text-white font-medium py-3 rounded-xl text-xs tracking-wide hover:bg-neutral-800 transition">
                    買い物リストに登録
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
